<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Язык жестов мафии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eedac5;
  --paper:#f6ecdf;
  --ink:#3c3a44;
  --red:#d23a3b;
  --rule:rgba(60,58,68,.28);
  --soft:rgba(60,58,68,.72);
  --serif:"Playfair Display",Georgia,serif;
  --caps:"Jost","Helvetica Neue",Arial,sans-serif;
  --body:"Lora",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:0 24px 72px}
.caps{font-family:var(--caps);text-transform:uppercase;letter-spacing:.22em;font-size:13px;font-weight:500}

/* шапка */
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:22px 0;flex-wrap:wrap}
.brand{text-decoration:none}
.brand b{color:var(--red);font-weight:500}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-family:var(--serif);text-decoration:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:15px}
.nav a.t{width:auto;padding:0 12px;border-radius:20px;font-family:var(--caps);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.nav a:hover{background:var(--paper)}
.nav a[aria-current="page"]{background:var(--red);color:var(--paper)}

/* заголовок */
.pill{display:inline-block;border:1.5px solid var(--ink);border-radius:50%;padding:6px 26px;font-family:var(--caps);letter-spacing:.14em;font-size:15px;text-transform:uppercase}
.hero{position:relative;padding:48px 0 30px;text-align:left}
.hero .pillrow{text-align:center;margin-bottom:40px}
.hero .kicker{margin:0 0 4px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,7.4vw,78px);line-height:1.02;margin:0;text-wrap:balance}
.hero h1 em{font-style:italic;font-weight:500}
.hero h1 .up{text-transform:uppercase;letter-spacing:.02em}
.hero .arrow{position:absolute;right:0;top:0;width:min(42%,360px);height:auto;pointer-events:none}
.lead{max-width:60ch;margin:24px 0 0;color:var(--soft)}

/* дорожная карта */
.road{position:relative;margin:48px 0 8px}
.road::before{content:"";position:absolute;left:50%;top:30px;bottom:30px;width:1.5px;background:var(--paper);transform:translateX(-50%)}
.step{display:grid;grid-template-columns:1fr 90px 1fr;align-items:start;min-height:120px;text-decoration:none}
.step .star{grid-column:2;justify-self:center;position:relative;width:90px;height:90px}
.step .star svg{position:absolute;inset:0}
.step .star span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:26px;padding-top:2px}
.step .side{padding:16px 8px 0}
.step .side h3{margin:0 0 6px;font-family:var(--caps);font-weight:500;text-transform:uppercase;letter-spacing:.2em;font-size:15px}
.step .side p{margin:0;font-size:15px;color:var(--soft);max-width:36ch}
.step .side .go{display:inline-block;margin-top:8px;font-family:var(--caps);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.step:nth-child(odd) .side{grid-column:3;grid-row:1}
.step:nth-child(even) .side{grid-column:1;grid-row:1;text-align:right}
.step:nth-child(even) .side p{margin-left:auto}
.step .grp{font-family:var(--caps);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--red);display:block;margin-bottom:4px}
.step:hover .star svg path{fill:#fff}
.step:hover h3{color:var(--red)}

/* страница шага */
.stagehead{padding:40px 0 8px}
.stagehead .kicker{margin:16px 0 4px}
section.block{margin-top:44px}
section.block>h2{font-family:var(--caps);font-weight:500;font-size:15px;letter-spacing:.22em;text-transform:uppercase;margin:0 0 6px;display:flex;align-items:center;gap:14px}
section.block>p.hint{margin:0 0 20px;color:var(--soft);max-width:62ch;font-size:15px}

/* жесты — компактный список */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px 28px}
.g{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;padding:8px 0}
.g .fig{width:76px;height:76px;border-radius:50%;background:var(--paper);display:grid;place-items:center;overflow:hidden}
.g .fig svg{width:62px;height:64px}
.g.two .fig{width:76px}
.fig img,.chip img,.qfig img{width:100%;height:100%;object-fit:cover;display:block}.g .tag{font-family:var(--caps);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.g h3{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 2px;line-height:1.2}
.g p{margin:0;font-size:14px;color:var(--soft);line-height:1.5}

.phrases{display:flex;flex-direction:column}
.phrase{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:10px 0}
.chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{width:46px;height:46px;border-radius:50%;background:var(--paper);display:grid;place-items:center;overflow:hidden}
.chip svg{width:38px;height:40px}
.plus{color:var(--red);font-family:var(--serif);font-size:20px}
.say{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.3}
.say small{display:block;font-family:var(--body);font-style:normal;font-size:14px;color:var(--soft);margin-top:2px}

.steps{list-style:none;padding:0;margin:0;max-width:720px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:8px 0;font-size:15px}
.steps li::before{content:counter(s);font-family:var(--serif);font-style:italic;font-size:26px;line-height:1;color:var(--red)}
.steps b{font-weight:500}

/* калькуляторы */
.tool{display:flex;flex-wrap:wrap;gap:28px 40px;align-items:flex-end;padding:24px 28px;background:var(--paper);border-radius:24px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-family:var(--caps);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button,.seg button{width:34px;height:34px;border-radius:50%;border:1px solid var(--ink);background:none;cursor:pointer;font-size:18px;line-height:1}
.stepper button:hover,.seg button:hover{background:var(--bg)}
.stepper output{min-width:46px;text-align:center;font-family:var(--serif);font-size:30px;font-variant-numeric:tabular-nums}
.stepper,.seg{height:52px}
.seg{display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.result{margin-left:auto;text-align:right}
.result .big{font-family:var(--serif);font-size:64px;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.result .why{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}

.table-wrap{display:grid;grid-template-columns:280px 1fr;gap:36px;align-items:center}
.table-wrap svg{width:100%;height:auto}
.cands{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.cands button{width:36px;height:36px;border-radius:50%;border:1px solid var(--ink);background:none;cursor:pointer;font-family:var(--serif);font-size:16px}
.cands button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--paper)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.callout{margin:18px 0 0;padding-left:16px;border-left:2px solid var(--red);font-size:15px;max-width:52ch}

.pager{display:flex;justify-content:space-between;gap:16px;margin-top:60px;flex-wrap:wrap}
.pager a{text-decoration:none;font-family:var(--caps);font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:10px 0}
.pager a.next{color:var(--red)}
.pager a:hover{text-decoration:underline}

/* тренажёр */
.quiz{display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:center}
.qfig{width:220px;height:220px;border-radius:50%;background:var(--paper);display:grid;place-items:center;overflow:hidden}
.qfig svg{width:150px;height:156px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.opts button{background:none;border:1px solid var(--ink);border-radius:30px;padding:10px 16px;cursor:pointer;text-align:left;font-family:var(--serif);font-size:17px}
.opts button:hover{background:var(--paper)}
.opts button.ok{background:var(--ink);color:var(--paper)}
.opts button.bad{background:var(--red);border-color:var(--red);color:var(--paper)}
.score{font-family:var(--caps);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.qnext{background:var(--red);border:0;color:var(--paper);padding:10px 20px;border-radius:30px;font-family:var(--caps);letter-spacing:.16em;text-transform:uppercase;font-size:12px;cursor:pointer}
.qrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.feedback{font-size:15px;font-style:italic}
.quiz.ch{grid-template-columns:auto 1fr}
.combo{display:flex;align-items:center;gap:12px}
.qfig.sm{width:160px;height:160px}
.plus.big{font-size:34px}
@media (max-width:720px){.qfig.sm{width:120px;height:120px}}

footer{margin-top:72px;text-align:center}
footer .mark{font-family:var(--caps);letter-spacing:.3em;text-transform:uppercase;font-size:20px;line-height:1.2}
footer .mark b{color:var(--red);font-weight:500}
footer p{font-size:13px;color:var(--soft);margin:10px auto 0;max-width:52ch}

@media (max-width:720px){
  .hero .arrow{display:none}
  .road::before{left:32px}
  .step{grid-template-columns:64px 1fr}
  .step .star{grid-column:1;width:64px;height:64px}
  .step .star span{font-size:20px}
  .step:nth-child(odd) .side,.step:nth-child(even) .side{grid-column:2;text-align:left;padding-top:8px}
  .step:nth-child(even) .side p{margin-left:0}
  .table-wrap,.quiz{grid-template-columns:1fr}
  .phrase{grid-template-columns:1fr}
  .result{margin-left:0;text-align:left}
  .opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand caps" href="#">Мафия <b>·</b> жесты</a>
    <nav class="nav" id="nav" aria-label="Шаги"></nav>
  </header>
  <main id="app"></main>
  <footer><p>Контакт для связи: <a href="https://t.me/zhenjoo">@zhenjoo</a> (Telegram)</p></footer>
</div>
<script>
/* ---------- фото жестов (img/*.webp) ---------- */
const PHOTO={d3:'3',d11:'11',civ:'cerveny',maf:'cerny',don:'don',sher:'sherif',ask:'vopros',ifg:'esli',cross:'net',slap:'vystavit-na-golosovanije',gun:'pistolet',wave:'ahalaj',plus:'plus',minus:'minus'};
const GX={};
for(const k in PHOTO)GX[k]=()=>`<img src="img/${PHOTO[k]}.webp" alt="Жест" loading="lazy">`;

/* ---------- контент ---------- */
const STAR='<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 2 L56 40 L76 24 L60 44 L98 50 L60 56 L76 76 L56 60 L50 98 L44 60 L24 76 L40 56 L2 50 L40 44 L24 24 L44 40 Z" fill="#f6ecdf"/></svg>';
const STAGES=[
 {g:'База',t:['цифры','и роли'],name:'Цифры и роли',sum:'Номер игрока и четыре знака ролей. Из них собирается любая фраза за столом.'},
 {g:'База',t:['фразы','без слов'],name:'Фразы без слов',sum:'Вопрос, «выставляй», «если», «нет» и «пистолет». Складываем жесты в предложения.'},
 {g:'Голосование',t:['попил','стола'],name:'Попил стола',sum:'Как голосованием выяснить, на чьей стороне первый игрок, который почти весь круг молчит.'},
 {g:'Чёрные',t:['ночная','договорка'],name:'Договорка',sum:'Дон за несколько секунд ночи задаёт команде, в кого стрелять дальше.'}
];
const gi=(g,tag,title,txt)=>`<div class="g"><div class="fig">${GX[g]()}</div><div><div class="tag">${tag}</div><h3>${title}</h3><p>${txt}</p></div></div>`;
const chip=g=>`<span class="chip">${GX[g]()}</span>`;
const phrase=(chips,say,sub)=>`<div class="phrase"><div class="chips">${chips.map(c=>c==='+'?'<span class="plus">+</span>':chip(c)).join('')}</div><div class="say">${say}<small>${sub}</small></div></div>`;
const stepper=(id,label,v,min,max)=>`<div class="field"><label id="${id}-l">${label}</label><div class="stepper" role="group" aria-labelledby="${id}-l"><button type="button" data-step="${id}" data-d="-1" aria-label="Меньше">−</button><output id="${id}" data-min="${min}" data-max="${max}">${v}</output><button type="button" data-step="${id}" data-d="1" aria-label="Больше">+</button></div></div>`;
const result=(id,label)=>`<div class="result"><div class="caps" style="font-size:11px;color:var(--soft)">${label}</div><div class="big" id="${id}"></div><div class="why" id="${id}-why"></div></div>`;
const wrap10=n=>((n-1)%10+10)%10+1;

const BODY={
1:()=>`
<section class="block"><h2>Числа</h2><p class="hint">Столько пальцев, какое число. 10 — кулак, больше 10 — кулак + число.</p>
<div class="glist">
${gi('d3','число','Три','Три пальца. Так же показываются все числа до 9.')}
${gi('d11','число','Одиннадцать','Кулак + один палец: 10 + 1.')}
</div></section>
<section class="block"><h2>Номер и роль</h2><p class="hint">Сначала номер места, потом роль: «этот игрок — такой-то». Ладонь к столу, держим жест секунду-две, чтобы все успели прочитать.</p>
<div class="glist">
${gi('civ','красные','Мирный','Кулак, большой палец вверх.')}
${gi('maf','чёрные','Мафия','Кулак, большой палец вниз.')}
${gi('don','чёрные','Дон','Большой палец на безымянном, будто поправляешь перстень.')}
${gi('sher','красные','Шериф','Большой и указательный в кольцо, остальные выпрямлены.')}
</div></section>`,
2:()=>`
<section class="block"><h2>Словарь</h2><p class="hint">Пять жестов, которыми идёт диалог, пока говорит другой игрок. Перебивать голосом нельзя, руками можно.</p>
<div class="glist">
${gi('ask','жест','Вопрос','Указательный изогнут крючком, как «?». Обращаешься к конкретному игроку.')}
${gi('slap','жест','Выставляй','Номер, палец вверх и короткий хлопок по столу: «вынеси его на голосование».')}
${gi('ifg','жест','Если','Большой палец и мизинец в стороны. Начинает условие.')}
${gi('cross','жест','Нет','Покачать головой или скрестить руки.')}
${gi('gun','жест','Пистолет','Указательный вперёд, большой вверх. С номером — «стреляйте в него».')}
</div></section>
<section class="block"><h2>Фразы</h2><p class="hint">Порядок как в речи: о ком, что, вопрос или вывод.</p>
<div class="phrases">
${phrase(['d3','+','don','+','ask'],'«Третий — дон?»','Спрашиваешь мнение собеседника')}
${phrase(['d11','+','maf'],'«Одиннадцатый — мафия»','Твоя версия для всего стола')}
${phrase(['ifg','+','d3','+','civ','+','d11','+','slap'],'«Если третий мирный — выставляй одиннадцатого»','Условие из двух частей')}
</div></section>`,
3:()=>`
<section class="block"><h2>Зачем</h2><p class="hint">Первый номер говорит речь в самом начале круга и потом почти до голосования молчит. Попил превращает голосование в проверку.</p>
<ol class="steps">
<li><div><b>Первый выставляет кандидата.</b> Без второй кандидатуры попила нет.</div></li>
<li><div><b>Стол делится на половины.</b> Каждый кандидат получает голоса «своей» стороны. Схема зависит от того, где сидит кандидат.</div></li>
<li><div><b>Смотрим, кто выбился.</b> Игрок, проголосовавший не со своей половиной, сам себя показал.</div></li>
</ol></section>
<section class="block"><h2>Кто за кого</h2><p class="hint">Выбери номер, которого выставил первый игрок.</p>
<div class="table-wrap"><div id="popil-svg"></div>
<div><div class="caps" style="font-size:11px;color:var(--soft)">Кандидат первого</div><div class="cands" id="cands"></div>
<div class="legend"><div><i style="background:var(--ink)"></i>Голосуют за №1</div><div><i style="background:var(--red)"></i>Голосуют за кандидата <span id="cand-n"></span></div></div>
<p class="callout" id="popil-txt"></p></div></div></section>`,
4:()=>`
<section class="block"><h2>Три жеста дона</h2><p class="hint">Ночью, пока стол «спит», у мафии есть несколько секунд.</p>
<div class="glist">
${gi('wave','шаг 1','Ахалай-махалай','Дон машет ладонями — привлекает внимание команды. Сигнал: «начинаем договорку».')}
${gi('plus','шаг 2','Плюс','Два пальца крестом: отсчитываем вперёд по столу.')}
${gi('minus','шаг 2','Минус','Один палец горизонтально: отсчитываем назад.')}
${gi('d3','шаг 3','Смещение','Цифра: на сколько мест сдвинуться от базы.')}
</div></section>
<section class="block"><h2>Откуда база</h2>
<ol class="steps">
<li><div><b>Последняя цифра дона за день.</b> Днём дон показывает номера, как и все; последний из них и есть база.</div></li>
<li><div><b>Дон показывал значок шерифа</b> — база равна месту самого дона.</div></li>
<li><div><b>Дон за день не показал ничего</b> — стреляем в первого по столу самого красного игрока.</div></li>
</ol></section>
<section class="block"><h2>Считаем цель</h2><p class="hint">Цель = база ± смещение. После 10 снова идёт 1.</p>
<div class="tool">${stepper('g-base','База',7,1,10)}<div class="field"><label id="g-sign-l">Знак</label><div class="seg" role="group" aria-labelledby="g-sign-l"><button type="button" data-sign="1" aria-pressed="true">+</button><button type="button" data-sign="-1" aria-pressed="false">−</button></div></div>${stepper('g-off','Смещение',2,0,9)}${result('g-res','Стреляем в')}</div></section>`
};

/* ---------- страницы ---------- */
const app=document.getElementById('app');
const ARROW='<svg class="arrow" viewBox="0 0 360 260" aria-hidden="true"><path d="M350 0 C 340 120 240 210 40 238" fill="none" stroke="#3c3a44" stroke-width="1.6" stroke-dasharray="7 7"/><path d="M58 226 L36 239 L58 250" fill="none" stroke="#3c3a44" stroke-width="1.6"/></svg>';
const navHTML=cur=>STAGES.map((s,i)=>`<a href="#stage-${i+1}" title="${s.name}"${cur===i+1?' aria-current="page"':''}>${i+1}</a>`).join('')+`<a class="t" href="#trainer"${cur==='t'?' aria-current="page"':''}>Тренажёр</a><a class="t" href="#challenge"${cur==='c'?' aria-current="page"':''}>Испытание</a>`;
function home(){
  const steps=STAGES.map((s,i)=>`<a class="step" href="#stage-${i+1}"><div class="star">${STAR}<span>${i+1}</span></div><div class="side"><span class="grp">${s.g}</span><h3>${s.name}</h3><p>${s.sum}</p><span class="go">Открыть →</span></div></a>`).join('')
   +`<a class="step" href="#trainer"><div class="star">${STAR}<span style="color:var(--red)">✓</span></div><div class="side"><span class="grp">Практика</span><h3>Тренажёр</h3><p>Случайный жест и четыре варианта ответа. Прогоните перед первой игрой.</p><span class="go">Проверить себя →</span></div></a>`
   +`<a class="step" href="#challenge"><div class="star">${STAR}<span style="color:var(--red)">✓✓</span></div><div class="side"><span class="grp">Практика</span><h3>Испытание</h3><p>Два жеста подряд — одна фраза. Прочитай, что сказал игрок.</p><span class="go">Принять вызов →</span></div></a>`;
  return `<div class="hero">${ARROW}<div class="pillrow"><span class="pill">Гайд</span></div>
<p class="caps kicker">Язык жестов мафии</p><h1><em>в четырёх</em> <span class="up">шагах</span></h1>
<p class="lead">Говорить можно только в свою минуту. Всё остальное время стол разговаривает руками: номера, версии, вопросы и согласие. Идите по порядку — каждый шаг опирается на предыдущие.</p></div>
<div class="road">${steps}</div>`;
}
function stage(i){
  const s=STAGES[i-1],
   prev=i>1?`<a href="#stage-${i-1}">← ${STAGES[i-2].name}</a>`:`<a href="#">← Все шаги</a>`,
   next=i<STAGES.length?`<a class="next" href="#stage-${i+1}">${STAGES[i].name} →</a>`:`<a class="next" href="#trainer">Тренажёр →</a>`;
  return `<div class="stagehead"><span class="pill">Шаг ${i}</span><p class="caps kicker">${s.g} · ${i} из ${STAGES.length}</p>
<h1 style="font-family:var(--serif);font-weight:400;font-size:clamp(38px,6vw,60px);line-height:1.05;margin:0;text-wrap:balance"><em style="font-weight:500">${s.t[0]}</em> <span style="text-transform:uppercase">${s.t[1]}</span></h1><p class="lead">${s.sum}</p></div>
${BODY[i]()}<div class="pager">${prev}${next}</div>`;
}
const QUIZ=[['d3','3'],['d11','11'],
 ['civ','Мирный'],['maf','Мафия'],['don','Дон'],['sher','Шериф'],['ask','Вопрос'],['ifg','Если'],['cross','Нет'],['slap','Выставляй'],['gun','Пистолет'],['wave','Ахалай-махалай'],['plus','Плюс'],['minus','Минус']];
const Q={t:{ok:0,all:0,ans:null},c:{ok:0,all:0,ans:null}};
let mode='t';
const quizHead=(pill,kick,em,up,lead)=>`<div class="stagehead"><span class="pill">${pill}</span><p class="caps kicker">${kick}</p><h1 style="font-family:var(--serif);font-weight:400;font-size:clamp(38px,6vw,60px);line-height:1.05;margin:0"><em style="font-weight:500">${em}</em> <span style="text-transform:uppercase">${up}</span></h1><p class="lead">${lead}</p></div>`;
const quizBody=(fig,btn,cls)=>`<section class="block"><div class="quiz${cls}">${fig}<div><div class="score" id="qscore"></div><div class="opts" id="qopts"></div><div class="qrow"><button class="qnext" id="qnext" type="button">${btn}</button><div class="feedback" id="qfb" aria-live="polite"></div></div></div></div></section>`;
function trainer(){
  return quizHead('Практика','Проверить себя','угадай','жест','Что показывает рука? Счёт сбрасывается при обновлении страницы.')
   +quizBody('<div class="qfig" id="qfig"></div>','Следующий жест','')
   +`<div class="pager"><a href="#stage-4">← Договорка</a><a class="next" href="#challenge">Испытание →</a></div>`;
}
function challenge(){
  return quizHead('Испытание','Две руки — одна фраза','прочитай','фразу','Два жеста подряд складываются в предложение. Выбери, что сказал игрок.')
   +quizBody('<div class="combo"><div class="qfig sm" id="qfig"></div><span class="plus big">+</span><div class="qfig sm" id="qfig2"></div></div>','Следующая фраза',' ch')
   +`<div class="pager"><a href="#trainer">← Тренажёр</a><a class="next" href="#">Все шаги →</a></div>`;
}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const NUMS=[3,11]; /* только числа, для которых есть фото */
const ORD={3:'Третий',11:'Одиннадцатый'};
const ACC={3:'третьего',11:'одиннадцатого'};
const ROLES={civ:'мирный',maf:'мафия',don:'дон',sher:'шериф'};
const RK=Object.keys(ROLES);
const KIND={
  role:(n,r)=>({g:['d'+n,r],a:`${ORD[n]} — ${ROLES[r]}`}),
  ask:(n,r)=>({g:['ask',r],a:`Кто ${ROLES[r]}?`}),
  slap:(n)=>({g:['d'+n,'slap'],a:`Выставляй ${ACC[n]}`}),
  cross:(n)=>({g:['d'+n,'cross'],a:`${ORD[n]} — нет`}),
  gun:(n)=>({g:['d'+n,'gun'],a:`Стреляйте в ${ACC[n]}`})
};
const KW=['role','role','role','ask','slap','cross','gun'];
function makeC(){const k=rnd(KW),n=rnd(NUMS),r=rnd(RK);return {k,n,r,...KIND[k](n,r)};}
function distractor(c){
  const t=Math.random();
  if(t<.4)return KIND[c.k](rnd(NUMS),c.r);
  if(t<.75)return KIND[c.k](c.n,rnd(RK));
  return KIND[rnd(Object.keys(KIND))](c.n,c.r);
}
function setOpts(list){
  const box=document.getElementById('qopts');delete box.dataset.done;
  box.innerHTML=list.sort(()=>Math.random()-.5).map(o=>`<button type="button" data-a="${o}">${o}</button>`).join('');
  document.getElementById('qfb').textContent='';
  document.getElementById('qscore').textContent=`Верно ${Q[mode].ok} из ${Q[mode].all}`;
}
function newQ(){
  if(mode==='c'){
    const c=makeC(),opts=[c.a];let guard=0;
    while(opts.length<4&&guard++<200){const d=distractor(c).a;if(!opts.includes(d))opts.push(d);}
    Q.c.ans=c.a;
    document.getElementById('qfig').innerHTML=GX[c.g[0]]();
    document.getElementById('qfig2').innerHTML=GX[c.g[1]]();
    setOpts(opts);return;
  }
  const pick=rnd(QUIZ), pool=QUIZ.map(q=>q[1]);
  const opts=[pick[1]];
  while(opts.length<4){const o=rnd(pool);if(!opts.includes(o))opts.push(o);}
  Q.t.ans=pick[1];
  document.getElementById('qfig').innerHTML=GX[pick[0]]();
  setOpts(opts);
}
function popil(k){
  const vote=s=>k<=5?((s>=2&&s<=6)?1:k):((s>=1&&s<=5)?k:1);
  const cx=150,cy=150,R0=112;
  let g=`<circle cx="${cx}" cy="${cy}" r="76" fill="#f6ecdf"/><text x="${cx}" y="${cy+5}" text-anchor="middle" fill="#3c3a44" font-family="Jost" font-size="12" letter-spacing="4">СТОЛ</text>`;
  for(let s=1;s<=10;s++){
    const a=-Math.PI/2+(s-1)*Math.PI/5,x=cx+R0*Math.cos(a),y=cy+R0*Math.sin(a),v=vote(s),isC=s===1||s===k;
    g+=`${isC?`<circle cx="${x}" cy="${y}" r="27" fill="none" stroke="#3c3a44" stroke-width="1.2" stroke-dasharray="3 3"/>`:''}<circle cx="${x}" cy="${y}" r="20" fill="${v===1?'#3c3a44':'#d23a3b'}"/><text x="${x}" y="${y+6}" text-anchor="middle" fill="#f6ecdf" font-family="Playfair Display" font-size="17">${s}</text>`;
  }
  document.getElementById('popil-svg').innerHTML=`<svg viewBox="0 0 300 300" role="img" aria-label="Схема голосования за столом">${g}</svg>`;
  document.getElementById('cand-n').textContent='№'+k;
  const f1=[],fk=[];for(let s=1;s<=10;s++)(vote(s)===1?f1:fk).push(s);
  document.getElementById('popil-txt').textContent=k<=5
   ?`Кандидат в первой половине стола. За №1 голосуют места ${f1.join(', ')}, за №${k} — ${fk.join(', ')}.`
   :`Кандидат во второй половине: стол делится «бортами». За №${k} голосуют места ${fk.join(', ')}, за №1 — ${f1.join(', ')}.`;
  document.querySelectorAll('#cands button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.k===k));
}
const val=id=>+document.getElementById(id)?.textContent;
let gSign=1;
function calc(){
  const set=(id,v,w)=>{document.getElementById(id).textContent=v;document.getElementById(id+'-why').textContent=w;};
  if(document.getElementById('g-res')){const b=val('g-base'),o=val('g-off'),r=wrap10(b+gSign*o);set('g-res',r,`${b} ${gSign>0?'+':'−'} ${o} → место ${r}`);}
}
app.addEventListener('click',e=>{
  const st=e.target.closest('[data-step]');
  if(st){const o=document.getElementById(st.dataset.step);o.textContent=Math.min(+o.dataset.max,Math.max(+o.dataset.min,+o.textContent+ +st.dataset.d));calc();return;}
  const sg=e.target.closest('[data-sign]');
  if(sg){gSign=+sg.dataset.sign;document.querySelectorAll('[data-sign]').forEach(b=>b.setAttribute('aria-pressed',b===sg));calc();return;}
  const cd=e.target.closest('#cands button');if(cd){popil(+cd.dataset.k);return;}
  const an=e.target.closest('#qopts button');
  if(an&&Q[mode].ans&&!an.parentElement.dataset.done){
    const q=Q[mode];an.parentElement.dataset.done='1';q.all++;const ok=an.dataset.a===q.ans;if(ok)q.ok++;
    an.classList.add(ok?'ok':'bad');
    if(!ok)[...an.parentElement.children].find(b=>b.dataset.a===q.ans).classList.add('ok');
    document.getElementById('qfb').textContent=ok?'Верно.':`Правильно: «${q.ans}».`;
    document.getElementById('qscore').textContent=`Верно ${q.ok} из ${q.all}`;return;
  }
  if(e.target.id==='qnext')newQ();
});
function route(){
  const h=location.hash.slice(1),m=h.match(/^stage-([1-4])$/);let cur=null;
  if(m){cur=+m[1];app.innerHTML=stage(cur);}
  else if(h==='trainer'){cur='t';mode='t';app.innerHTML=trainer();newQ();}
  else if(h==='challenge'){cur='c';mode='c';app.innerHTML=challenge();newQ();}
  else app.innerHTML=home();
  document.getElementById('nav').innerHTML=navHTML(cur);
  if(cur===3){document.getElementById('cands').innerHTML=[2,3,4,5,6,7,8,9,10].map(k=>`<button type="button" data-k="${k}" aria-pressed="false">${k}</button>`).join('');popil(4);}
  calc();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
